name: Sincronizar dados oficiais do TSE

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/apuracao.json"
  schedule:
    # O TSE publica atualizações durante a apuração; execuções agendadas podem atrasar.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-tse
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Consultar dados atuais do TSE (com cache-buster)
        shell: bash
        run: |
          set -u
          base_url="https://resultados.tse.jus.br/oficial/ele2026/6258/dados/br/br-c0001-e006258-u.json"
          agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          mkdir -p docs/data
          for attempt in 1 2 3; do
            url="${base_url}?pulso_cache=$(date +%s%N)"
            if curl --fail --location --silent --show-error --max-time 25 \
              --user-agent "$agent" \
              -H "Accept: application/json,text/plain,*/*" \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              "$url" -o /tmp/apuracao.json; then
              if jq -e 'type == "object" and (.carg | type == "array") and (.s | type == "object") and (.v | type == "object")' /tmp/apuracao.json >/dev/null; then
                if python3 - /tmp/apuracao.json <<'PY'
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          try:
              published = datetime.strptime(
                  str(data["dg"]) + " " + str(data["hg"]), "%d/%m/%Y %H:%M:%S"
              ).replace(tzinfo=ZoneInfo("America/Sao_Paulo"))
          except Exception as exc:
              print(f"Timestamp do TSE inválido: {exc}")
              raise SystemExit(1)
          now = datetime.now(ZoneInfo("America/Sao_Paulo"))
          age = (now - published).total_seconds()
          print(f"Timestamp do TSE: {published.isoformat()}; idade: {age/60:.1f} min.")
          if age < -120 or age > 720:
              print("O TSE respondeu com um arquivo antigo ou com horário futuro; não substituir o espelho.")
              raise SystemExit(1)
          PY
                then
                  install -m 0644 /tmp/apuracao.json docs/data/apuracao.json
                  echo "Arquivo oficial válido e recente recebido."
                  exit 0
                fi
              else
                echo "::warning::O arquivo do TSE não tem a estrutura esperada."
              fi
            else
              echo "::warning::Falha HTTP/rede na tentativa $attempt."
            fi
            sleep 4
          done
          echo "::warning::Não foi possível obter um arquivo atual. Mantendo o último espelho sem sobrescrever dados com conteúdo antigo."
          exit 0

      - name: Baixar fotos oficiais dos candidatos
        shell: bash
        run: |
          set +e
          mkdir -p docs/photos
          jq -r '[.carg[] | select(.cd == "1") | .agr[]?.par[]?.cand[]? | select(.sqcand != null and (.sqcand | tostring | length) > 0) | .sqcand] | unique[]' docs/data/apuracao.json > /tmp/candidate-photos.txt 2>/dev/null
          if [ ! -s /tmp/candidate-photos.txt ]; then
            echo "Nenhum identificador de foto encontrado; seguindo sem interromper a publicação."
            exit 0
          fi
          while IFS= read -r id; do
            case "$id" in
              *[!0-9]*|"") echo "Ignorando identificador de foto inválido."; continue ;;
            esac
            destination="docs/photos/$id.jpeg"
            if [ -s "$destination" ]; then
              continue
            fi
            url="https://resultados.tse.jus.br/oficial/ele2026/6258/fotos/br/$id.jpeg?pulso_cache=$(date +%s%N)"
            tmp="$(mktemp)"
            if curl --fail --location --silent --show-error --max-time 20 \
              --user-agent "Mozilla/5.0" \
              -H "Cache-Control: no-cache" "$url" -o "$tmp"; then
              magic="$(od -An -N2 -tx1 "$tmp" | tr -d ' \n')"
              if [ "$magic" = "ffd8" ] && [ "$(wc -c < "$tmp")" -gt 512 ]; then
                mv "$tmp" "$destination"
                echo "Foto oficial baixada: $id.jpeg"
                continue
              fi
            fi
            rm -f "$tmp"
            echo "::warning::Foto oficial indisponível para o identificador $id."
          done < /tmp/candidate-photos.txt

      - name: Publicar os arquivos atualizados no repositório
        shell: bash
        run: |
          git add docs/data/apuracao.json docs/photos/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza dados oficiais e fotos dos candidatos"
            git push
          else
            echo "Dados e fotos não mudaram; nenhum commit extra."
          fi
